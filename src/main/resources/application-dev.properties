spring.application.name=Life_ledger_backend

# Spring Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/life_ledger
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Server Configuration
server.port=8080

# JWT / Security Config
jwt.secret=YourJWTSecretKeyHereChangeThisToASecureRandomString123456789
jwt.expirationMs=86400000

# Logging
logging.level.org.springframework=INFO
logging.level.com.lifeledger=DEBUG

# redis
spring.data.redis.repositories.enabled=false

# File Upload Properties
file.upload-dir=uploads/

