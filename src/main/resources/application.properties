# Spring Profiles
spring.application.name=Life_ledger_backend
spring.profiles.active=dev

# JMX Configuration
spring.jmx.enabled=false
management.endpoints.jmx.exposure.exclude=*

# PDF Processing Configuration
pdf.processing.enhanced-processing=true
pdf.processing.min-transactions-threshold=3
pdf.processing.debug-logging=true
pdf.processing.max-file-size-mb=10

# Logging Configuration
logging.level.com.Life_ledger.service=DEBUG
logging.level.com.Life_ledger.controller=DEBUG