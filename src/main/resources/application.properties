# Spring Profiles
spring.application.name=Life_ledger_backend
spring.profiles.active=dev

# Database Configuration (fallback)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload
file.upload-dir=uploads/
app.upload-dir=uploads/
app.text-dir=uploads/txt/

# API Configuration
gemini.api.key=${GEMINI_API_KEY:your-api-key-here}
gemini.endpoint=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent?key=


# HTTP timeout settings
server.tomcat.connection-timeout=300000
spring.mvc.async.request-timeout=300000
